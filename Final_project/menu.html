<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the full menu of snacks and meals from local vendors on Snack On.">
    <meta name="author" content="Favour Ojobor">
    <meta property="og:title" content="Snack On - Menu">
    <meta property="og:description" content="Check out our wide range of snacks and meals available for order.">
    <meta property="og:image" content="https://yourusername.github.io/wdd231/final/images/snack-on-logo.png">
    <meta property="og:url" content="https://yourusername.github.io/wdd231/final/menu.html">
    <title>Snack On - Menu</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/final-style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arial&display=swap">
    <script type="module" src="scripts/menu.js" defer></script>
</head>
<body>
    <header>
        <img src="images/snack-on-logo.jpeg" alt="Snack On Logo" class="logo">
        <nav>
            <button id="menu-toggle" class="hamburger">☰</button>
            <ul id="primary-nav">
                <li><a href="index.html">HOME</a></li>
                <li><a href="menu.html" class="active">MENU</a></li>
                <li><a href="order.html">ORDER</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search menu items..." aria-label="Search menu items">
        </div>
        <section class="categories">
            <h2>Categories</h2>
            <div class="category-list">
                <button class="category-btn" data-category="snacks">Snacks</button>
                <button class="category-btn" data-category="meals">Meals</button>
                <button class="category-btn" data-category="drinks">Drinks</button>
            </div>
        </section>
        <section class="menu-items">
            <h2>Menu Items</h2>
            <div id="item-list" class="item-grid"></div>
        </section>
    </main>
    <footer>
        <p>© <span id="current-year"></span> Snack On, Nigeria | 
        <a href="attributions.html">Attributions</a> | 
        <a href="https://youtu.be/your-video-id" target="_blank">Demo Video</a></p>
    </footer>
</body>
</html>
