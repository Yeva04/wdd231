<!DOCTYPE html>
<html lang="en">
<head>
    <title>Snack On - Complaints</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit your complaint about a meal or service from Snack On.">
    <meta name="author" content="Favour Ojobor">
    <meta property="og:title" content="Snack On - Complaints">
    <meta property="og:description" content="Let us know if you had any issues with our meals or service.">
    <meta property="og:image" content="https://yourusername.github.io/wdd231/final/images/snack-on-logo.png">
    <meta property="og:url" content="https://yourusername.github.io/wdd231/final/complaints.html">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="styles/final-style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <script type="module" src="scripts/complaints.js"></script>
</head>
<body>
    <header>
        <img src="images/snack-on-logo.jpeg" alt="Snack On Logo" class="logo">
        <nav>
            <button id="menu-toggle" class="hamburger">☰</button>
            <ul id="primary-nav">
                <li><a href="index.html">HOME</a></li>
                <li><a href="menu.html">MENU</a></li>
                <li><a href="order.html">ORDER</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Cancel Order</h2>
        <form id="complaint-form">
            <label for="name">Full Name:
                <input type="text" id="name" name="name" required>
            </label>
            <label for="email">Email:
                <input type="email" id="email" name="email" required>
            </label>
            <label for="complaint">Reason for cancellation:
                <textarea id="complaint" name="complaint" required></textarea>
            </label>
            <button type="submit">Submit</button>
        </form>
        <a href="index.html" class="back-to-home">← Back to Home</a>
    </main>
    <footer>
        <p>© <span id="current-year"></span> Snack Ons, Asaba Delta Nigeria | 
        <a href="attributions.html">Attributions</a> | 
        <a href="https://www.loom.com/share/6c0db0fe5cf749fe9ef63519ba8f755e?sid=2265ad9c-a237-4846-b24d-88157887908f" target="_blank">Loom Demo Video</a></p>
    </footer>
</body>
</html>
