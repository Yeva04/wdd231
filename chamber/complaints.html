<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snack On - Complaints</title>
    <meta name="description" content="Submit your complaints or feedback for Snack On.">
    <meta name="author" content="Your Full Name">
    <meta property="og:title" content="Snack On - Complaints">
    <meta property="og:description" content="Let us know your issues with your orders at Snack On.">
    <meta property="og:image" content="https://yourusername.github.io/wdd231/final/images/complaints-preview.jpg">
    <meta property="og:url" content="https://yourusername.github.io/wdd231/final/complaints.html">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" type="text/css">
    <link rel="stylesheet" href="styles/final-style.css">
</head>
<body>
    <header>
        <img src="images/snack-on-logo.png" alt="Snack On Logo" class="logo">
        <nav>
            <button id="menu-toggle" class="hamburger">☰</button>
            <ul id="primary-nav">
                <li><a href="final.html">Home</a></li>
                <li><a href="order.html">Order</a></li>
                <li><a href="complaints.html">Complaints</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Submit a Complaint</h1>
        <form id="complaint-form" action="complaint-action.html" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="issue">Issue:</label>
            <textarea id="issue" name="issue" required></textarea>
            <button type="submit">Submit</button>
        </form>
        <button id="status-modal-btn">Check Status</button>
    </main>
    <footer>
        <p>© <span id="current-year"></span> Snack On | <a href="#">Attributions</a> | <a href="https://youtu.be/your-video-id" target="_blank">Demo Video</a></p>
    </footer>
    <script type="module" src="scripts/complaints.js"></script>
</html>
